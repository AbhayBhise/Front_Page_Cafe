name: CI / Production Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Frontend Linter
        run: npm run lint

      - name: Frontend Typecheck and Production Build
        run: npm run build

  backend-check:
    name: Backend Build & Typecheck
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/frontpagecafe'
      JWT_ACCESS_SECRET: 'ci_test_access_secret_key_1234567890'
      JWT_REFRESH_SECRET: 'ci_test_refresh_secret_key_1234567890'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma Schema Validation
        working-directory: backend
        run: npx prisma validate

      - name: Generate Prisma Client Types
        working-directory: backend
        run: npx prisma generate

      - name: Backend Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend Production Build
        working-directory: backend
        run: npm run build

  docker-build-check:
    name: Dockerfile Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test Frontend Docker Build
        run: docker build -t front-page-cafe-web:test -f ./Dockerfile .

      - name: Test Backend Docker Build
        run: docker build -t front-page-cafe-api:test -f ./backend/Dockerfile ./backend
