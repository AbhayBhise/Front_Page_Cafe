apiVersion: apps/v1
kind: Deployment
metadata:
  name: fpc-api
  namespace: front-page-cafe
  labels:
    app: fpc-api
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fpc-api
  template:
    metadata:
      labels:
        app: fpc-api
        tier: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - fpc-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: ghcr.io/abhaybhise/front-page-cafe-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: fpc-config
            - secretRef:
                name: fpc-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: fpc-api-service
  namespace: front-page-cafe
spec:
  selector:
    app: fpc-api
  ports:
    - name: http
      port: 5000
      targetPort: 5000

