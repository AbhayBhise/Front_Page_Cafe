apiVersion: apps/v1
kind: Deployment
metadata:
  name: fpc-web
  namespace: front-page-cafe
  labels:
    app: fpc-web
    tier: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fpc-web
  template:
    metadata:
      labels:
        app: fpc-web
        tier: frontend
    spec:
      containers:
        - name: web
          image: ghcr.io/abhaybhise/front-page-cafe-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fpc-web-service
  namespace: front-page-cafe
spec:
  selector:
    app: fpc-web
  ports:
    - name: http
      port: 80
      targetPort: 80

