apiVersion: apps/v1
kind: Deployment
metadata:
  name: fpc-redis
  namespace: front-page-cafe
  labels:
    app: fpc-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fpc-redis
  template:
    metadata:
      labels:
        app: fpc-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fpc-redis-service
  namespace: front-page-cafe
spec:
  selector:
    app: fpc-redis
  ports:
    - port: 6379
      targetPort: 6379

