apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fpc-ingress
  namespace: front-page-cafe
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/websocket-services: 'fpc-api-service'
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  tls:
    - hosts:
        - frontpagecafe.com
        - www.frontpagecafe.com
      secretName: fpc-tls-cert
  rules:
    - host: frontpagecafe.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fpc-api-service
                port:
                  number: 5000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: fpc-api-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fpc-web-service
                port:
                  number: 80

