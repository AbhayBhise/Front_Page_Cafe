apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fpc-api-hpa
  namespace: front-page-cafe
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fpc-api
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

