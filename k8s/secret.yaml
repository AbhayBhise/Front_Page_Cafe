apiVersion: v1
kind: Secret
metadata:
  name: fpc-secrets
  namespace: front-page-cafe
type: Opaque
stringData:
  # In production, replace with base64/sealed-secrets or pull from AWS Secrets Manager / Vault
  DATABASE_URL: 'postgresql://fpc:CHANGE_ME_IN_PRODUCTION@postgres-service:5432/frontpagecafe?sslmode=disable'
  JWT_ACCESS_SECRET: 'REPLACE_WITH_STRONG_RANDOM_SECRET_GENERATED_VIA_OPENSSL_48_BYTES'
  JWT_REFRESH_SECRET: 'REPLACE_WITH_STRONG_RANDOM_SECRET_GENERATED_VIA_OPENSSL_48_BYTES'
  ADMIN_PASSWORD: 'REPLACE_WITH_SECURE_ADMIN_PASSWORD_MIN_16_CHARS'

