apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fpc-web-hpa
  namespace: front-page-cafe
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fpc-web
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

