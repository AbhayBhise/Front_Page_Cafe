services:
  # Backend API service
  - type: web
    name: front-page-cafe-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npm run prisma:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: front-page-cafe-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false

  # Frontend static / web service
  - type: web
    name: front-page-cafe-web
    runtime: static
    plan: starter
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: front-page-cafe-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: front-page-cafe-db
    plan: starter
    databaseName: frontpagecafe
    user: fpc

